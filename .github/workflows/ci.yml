name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run compile
      - run: bun run lint
      - run: bun run test -- --runInBand --coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-report-${{ matrix.os }}
          path: coverage/
          retention-days: 14

  package:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --ignore-scripts --frozen-lockfile
      - run: bun run package:vsix
      - uses: actions/upload-artifact@v7
        with:
          name: vsix
          path: "*.vsix"
          retention-days: 30

  release:
    needs: package
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: vsix
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes || true
          git push origin :latest || true
          git tag latest
          git push origin latest
          gh release create latest *.vsix --title "Latest build" --notes "Rolling build from the main branch. The extension checks this release for updates."
